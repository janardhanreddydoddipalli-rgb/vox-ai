name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    # Deterministic only: no real model calls (no GEMINI_API_KEY anywhere, and
    # web tests mock fetch). Real-model checks live in evals.yml (manual).
    # The database is for services/api, which E2E runs; the web app has none.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: pgvector/pgvector:pg18 # matches Neon (Postgres 18.7, pgvector 0.8.7)
        env:
          POSTGRES_USER: ubuntu
          POSTGRES_PASSWORD: ubuntu
          POSTGRES_DB: voicebot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ubuntu"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ubuntu:ubuntu@localhost:5432/voicebot_test
      AUTH_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # E2E runs the real API (Alembic migrates its database).
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Install API (Python)
        working-directory: services/api
        run: uv sync --frozen

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Generated TypeScript must match the committed OpenAPI schema, and compile.
      - name: API client is generated from the current schema
        working-directory: .
        run: |
          pnpm --filter @vox/api-client generate
          git diff --exit-code -- packages/api-client
          pnpm --filter @vox/api-client typecheck

      # Empty database → Alembic upgrade head (pgvector + every revision).
      - name: Migrate (fresh database)
        working-directory: services/api
        run: uv run alembic upgrade head

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # CI-only key pair and service token (ephemeral, never secrets).
      - name: Start services/api for E2E
        run: |
          node scripts/generate-api-jwt-keys.mjs > "$RUNNER_TEMP/keys.env"
          echo "API_JWT_PRIVATE_KEY=$(grep '^API_JWT_PRIVATE_KEY=' "$RUNNER_TEMP/keys.env" | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "API_INTERNAL_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
          export JWT_PUBLIC_KEY="$(grep '^JWT_PUBLIC_KEY=' "$RUNNER_TEMP/keys.env" | cut -d= -f2-)"
          cd ../../services/api
          # The venv's uvicorn, not `uv run`: a long-lived uv process would hold
          # the uv cache lock and break setup-uv's post-job cache prune.
          WEB_ORIGIN=http://127.0.0.1:3010 INTERNAL_API_TOKEN=ci-only-0123456789abcdef0123456789             nohup .venv/bin/uvicorn vox_api.main:create_app --factory --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/v1/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1

      # The browser calls the API directly (NEXT_PUBLIC_API_URL = API_INTERNAL_URL).
      - name: E2E smoke (web + services/api)
        run: pnpm run test:e2e

      - name: API log, then stop the API
        if: always()
        run: |
          tail -n 50 "$RUNNER_TEMP/api.log" || true
          kill "$(cat "$RUNNER_TEMP/api.pid")" 2>/dev/null || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
