name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    # Deterministic only: no real model calls (GEMINI_API_KEY is a dummy, and
    # tests mock fetch). Real-model checks live in evals.yml (manual).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ubuntu
          POSTGRES_PASSWORD: ubuntu
          POSTGRES_DB: voicebot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ubuntu"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ubuntu:ubuntu@localhost:5432/voicebot_test
      DATABASE_URL: postgres://ubuntu:ubuntu@localhost:5432/voicebot_test
      AUTH_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Starts from an empty database: creates the vector extension, then
      # applies every migration (proves a fresh setup works).
      - name: Migrate (fresh database)
        run: pnpm run db:migrate

      - name: Unit + API tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke (no model calls)
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
