name: E2E

# Web build + Playwright against the real API on a freshly migrated database.
# Runs when either side changes. Deterministic: no GEMINI_API_KEY anywhere.
on:
  pull_request:
    branches: [main, phase10/integration]
    paths: &paths
      - "apps/web/**"
      - "packages/**"
      - "services/api/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main, phase10/integration]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: pgvector/pgvector:pg18 # matches Neon (Postgres 18.7, pgvector 0.8.7)
        env:
          POSTGRES_USER: ubuntu
          POSTGRES_PASSWORD: ubuntu
          POSTGRES_DB: voicebot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ubuntu"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ubuntu:ubuntu@localhost:5432/voicebot_test
      AUTH_SECRET: ci-only-not-a-secret
      AUTH_TRUST_HOST: "true" # next start outside Vercel
      E2E_TEST_AUTH: "1" # the password-less test sign-in (CI build only, never deployed)
      # CI-only service credential, shared by the web server (sign-in upsert) and the API.
      INTERNAL_API_TOKEN: ci-only-0123456789abcdef0123456789
      API_INTERNAL_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000 # inlined into the browser bundle at build time
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (web)
        run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - name: Install (API runtime only)
        working-directory: services/api
        run: uv sync --frozen --no-dev

      - name: Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/api-client/src/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm run build

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps (browser from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Empty database → Alembic upgrade head (pgvector + every revision), once.
      - name: Migrate (fresh database)
        working-directory: services/api
        run: .venv/bin/alembic upgrade head

      # CI-only key pair (ephemeral, never a secret).
      - name: Start services/api
        run: |
          node scripts/generate-api-jwt-keys.mjs > "$RUNNER_TEMP/keys.env"
          echo "API_JWT_PRIVATE_KEY=$(grep '^API_JWT_PRIVATE_KEY=' "$RUNNER_TEMP/keys.env" | cut -d= -f2-)" >> "$GITHUB_ENV"
          export JWT_PUBLIC_KEY="$(grep '^JWT_PUBLIC_KEY=' "$RUNNER_TEMP/keys.env" | cut -d= -f2-)"
          cd ../../services/api
          # The venv's uvicorn, not `uv run`: a long-lived uv process would hold
          # the uv cache lock and break setup-uv's post-job cache prune.
          WEB_ORIGIN=http://127.0.0.1:3010 nohup .venv/bin/uvicorn vox_api.main:create_app --factory --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/v1/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1

      # One production server (next start on the build above), chromium, 2 workers.
      - name: E2E smoke (web + services/api)
        run: pnpm run test:e2e

      - name: API log, then stop the API
        if: always()
        run: |
          tail -n 50 "$RUNNER_TEMP/api.log" || true
          kill "$(cat "$RUNNER_TEMP/api.pid")" 2>/dev/null || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
