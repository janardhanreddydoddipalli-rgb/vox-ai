name: Evals (manual, real model)

# Real-model checks cost money and are non-deterministic, so they never run
# on push or PR — only when started by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      pass_threshold:
        description: "Eval pass-rate threshold (0-1)"
        default: "0.9"

permissions:
  contents: read

jobs:
  evals:
    # 20-case scripted-conversation eval: services/api's agent loop against the real model.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: pgvector/pgvector:pg18 # matches Neon (Postgres 18.7, pgvector 0.8.7)
        env:
          POSTGRES_USER: ubuntu
          POSTGRES_PASSWORD: ubuntu
          POSTGRES_DB: voicebot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ubuntu"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ubuntu:ubuntu@localhost:5432/voicebot_test
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EVAL_PASS_THRESHOLD: ${{ inputs.pass_threshold }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install API (Python)
        run: uv sync --frozen
      - name: Require GEMINI_API_KEY
        run: test -n "$GEMINI_API_KEY" || (echo "Set the GEMINI_API_KEY repository secret first." && exit 1)
      - name: Eval (threshold gate)
        run: uv run python -m evals.run

  e2e-real-model:
    # Full text interview → scored report → PDF through the web app and services/api, real model.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: pgvector/pgvector:pg18 # matches Neon (Postgres 18.7, pgvector 0.8.7)
        env:
          POSTGRES_USER: ubuntu
          POSTGRES_PASSWORD: ubuntu
          POSTGRES_DB: voicebot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ubuntu"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ubuntu:ubuntu@localhost:5432/voicebot_test
      AUTH_SECRET: ci-only-not-a-secret
      # CI-only service credential, shared by the web server (sign-in upsert) and the API.
      INTERNAL_API_TOKEN: ci-only-0123456789abcdef0123456789
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # read by services/api, the only model caller
      E2E_REAL_MODEL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v7
      - name: Install API (Python)
        working-directory: services/api
        run: uv sync --frozen
      - name: Require GEMINI_API_KEY
        run: test -n "$GEMINI_API_KEY" || (echo "Set the GEMINI_API_KEY repository secret first." && exit 1)
      - name: Migrate and seed the question bank (fresh database)
        working-directory: services/api
        run: |
          uv run alembic upgrade head
          uv run python scripts/seed_questions.py
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      # Ephemeral key pair and service token for this run only (never secrets).
      - name: Start services/api
        run: |
          node scripts/generate-api-jwt-keys.mjs > "$RUNNER_TEMP/keys.env"
          echo "API_JWT_PRIVATE_KEY=$(grep '^API_JWT_PRIVATE_KEY=' "$RUNNER_TEMP/keys.env" | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "API_INTERNAL_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
          export JWT_PUBLIC_KEY="$(grep '^JWT_PUBLIC_KEY=' "$RUNNER_TEMP/keys.env" | cut -d= -f2-)"
          cd ../../services/api
          WEB_ORIGIN=http://127.0.0.1:3010 \
            nohup .venv/bin/uvicorn vox_api.main:create_app --factory --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/v1/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1
      - name: E2E (real model)
        run: pnpm run test:e2e:real-model
      - name: API log
        if: always()
        run: tail -n 100 "$RUNNER_TEMP/api.log" || true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-real-model
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
