name: Evals (manual, real model)

# Real-model checks cost money and are non-deterministic, so they never run
# on push or PR — only when started by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      pass_threshold:
        description: "Eval pass-rate threshold (0-1)"
        default: "0.9"

permissions:
  contents: read

jobs:
  evals:
    # 20-case scripted-conversation eval against the real model.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ubuntu
          POSTGRES_PASSWORD: ubuntu
          POSTGRES_DB: voicebot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ubuntu"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ubuntu:ubuntu@localhost:5432/voicebot_test
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EVAL_PASS_THRESHOLD: ${{ inputs.pass_threshold }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Require GEMINI_API_KEY
        run: test -n "$GEMINI_API_KEY" || (echo "Set the GEMINI_API_KEY repository secret first." && exit 1)
      - name: Eval (threshold gate)
        run: pnpm run eval

  e2e-real-model:
    # Full text interview → scored report → PDF, against the real model.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ubuntu
          POSTGRES_PASSWORD: ubuntu
          POSTGRES_DB: voicebot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ubuntu"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ubuntu:ubuntu@localhost:5432/voicebot_test
      AUTH_SECRET: ci-only-not-a-secret
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Require GEMINI_API_KEY
        run: test -n "$GEMINI_API_KEY" || (echo "Set the GEMINI_API_KEY repository secret first." && exit 1)
      - name: Migrate (fresh database)
        run: pnpm run db:migrate
      - name: Seed question bank
        run: pnpm exec tsx scripts/seed-questions.ts
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (real model)
        run: pnpm run test:e2e:real-model
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-real-model
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
