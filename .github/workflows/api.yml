name: API

on:
  pull_request:
    branches: [main]
    paths: &paths
      - "services/api/**"
      - "packages/api-client/**"
      - "infra/docker/api.Dockerfile"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: services/api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --frozen
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --frozen
      - name: Mypy (strict)
        run: uv run mypy

  test:
    # Deterministic: no model calls (FakeProvider only). Real Postgres 18 + pgvector:
    # the CI service container (TEST_DATABASE_URL set, so no testcontainers). The
    # suite migrates it once, then each xdist worker tests in its own copy.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18 # matches Neon (Postgres 18.7, pgvector 0.8.7)
        env:
          POSTGRES_USER: ubuntu
          POSTGRES_PASSWORD: ubuntu
          POSTGRES_DB: vox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ubuntu"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ubuntu:ubuntu@localhost:5432/vox_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - name: Install (exact lockfile, Python from .python-version)
        run: uv sync --frozen

      - name: Pytest (parallel, one database per worker)
        run: uv run pytest -n auto

      - name: OpenAPI schema is current (packages/api-client/openapi.json)
        run: uv run python scripts/export_openapi.py --check

      # A fresh, empty database must migrate to head, and the models must
      # match the migrations exactly (no pending autogenerate operations).
      - name: Alembic upgrade on an empty database + model/migration check
        env:
          PGPASSWORD: ubuntu
          DATABASE_URL: postgresql://ubuntu:ubuntu@localhost:5432/alembic_empty
        run: |
          psql -h localhost -U ubuntu -d postgres -c "CREATE DATABASE alembic_empty"
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check

  docker:
    # The production image builds and starts (health answers) without a database.
    # Only on main, and on PRs that change services/api or its Dockerfile.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Image inputs changed?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ] || \
             ! git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- services/api infra/docker/api.Dockerfile; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "No image inputs changed: skipping the build."
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.changed.outputs.build == 'true'
      - name: Build (layers cached in GitHub Actions)
        if: steps.changed.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: services/api
          file: infra/docker/api.Dockerfile
          tags: vox-api:ci
          load: true
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image
      - name: Smoke (liveness, non-root)
        if: steps.changed.outputs.build == 'true'
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=postgresql://u:p@127.0.0.1:1/none \
            -e WEB_ORIGIN=http://localhost:3000 \
            -e JWT_PUBLIC_KEY=unused \
            -e INTERNAL_API_TOKEN=ci-only-0123456789abcdef0123456789 \
            vox-api:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/v1/health && break; sleep 1; done
          test "$(docker exec api id -u)" != "0"
          docker logs api | tail -5
