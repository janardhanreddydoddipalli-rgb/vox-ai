# Weekly dependency PRs. Minor/patch updates are grouped into one PR per
# ecosystem; majors (e.g. Next 16) come separately so they get a deliberate
# review (see docs/backlog.md).
version: 2
updates:
  - package-ecosystem: npm # covers pnpm (pnpm-lock.yaml)
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
