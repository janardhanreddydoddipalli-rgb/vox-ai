# Local services for development and tests: `make db-up` / `docker compose up -d --wait`.
# Not used in production (Neon + Upstash there).
#   App DB:   postgres://ubuntu:ubuntu@localhost:${POSTGRES_PORT:-5432}/voicebot
#   Test DB:  postgres://ubuntu:ubuntu@localhost:${POSTGRES_PORT:-5432}/voicebot_test
# If port 5432 is taken by another Postgres, set POSTGRES_PORT (e.g. 5434).
name: vox

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ubuntu
      POSTGRES_PASSWORD: ubuntu # local-only credentials
      POSTGRES_DB: voicebot
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubuntu -d voicebot"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Not used by the app yet (production rate limiting uses Upstash's REST API).
  # Reserved for the M2+ background workers (arq).
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
